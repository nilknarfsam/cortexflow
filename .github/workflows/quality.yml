name: Qualidade & CI/CD

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  # JOB PRINCIPAL: Validação da nova arquitetura C# (.NET 9)
  dotnet-quality:
    name: C# / .NET 9 Quality & Build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código fonte
        uses: actions/checkout@v4

      - name: Configurar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependências NuGet
        run: dotnet restore CortexFlow.sln

      - name: Compilar solução (Release)
        run: dotnet build CortexFlow.sln --configuration Release --no-restore

      - name: Executar testes automatizados (xUnit)
        run: dotnet test CortexFlow.sln --configuration Release --no-build --verbosity normal

  # JOB LEGADO: Validação do protótipo Python (mantido durante a migração)
  legacy-python-quality:
    name: Legacy Python Prototype Check
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código fonte
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            legacy_python/requirements.txt
            legacy_python/requirements-dev.txt

      - name: Instalar dependências legadas
        run: python -m pip install -r legacy_python/requirements.txt -r legacy_python/requirements-dev.txt

      - name: Executar testes legados Python
        run: python -m unittest discover -s legacy_python/tests -v
