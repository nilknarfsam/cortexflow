name: Qualidade & CI/CD (.NET 9)

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  # JOB PRINCIPAL: Validação da arquitetura C# (.NET 9)
  dotnet-quality:
    name: C# / .NET 9 Quality & Build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código fonte
        uses: actions/checkout@v4

      - name: Configurar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependências NuGet
        run: dotnet restore CortexFlow.sln

      - name: Compilar solução (Release)
        run: dotnet build CortexFlow.sln --configuration Release --no-restore

      - name: Executar testes automatizados (xUnit)
        run: dotnet test CortexFlow.sln --configuration Release --no-build --verbosity normal
