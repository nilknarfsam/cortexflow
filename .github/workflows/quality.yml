name: Qualidade

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Baixar código
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Verificar código
        run: python -m ruff check app.py src tests

      - name: Validar dependências principais
        run: >-
          python -c "import customtkinter, tkinterdnd2, whisper, torch,
          pdfplumber, docx, openpyxl, PIL, pytesseract;
          print('Dependências principais: OK')"

      - name: Executar testes com cobertura
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report

      - name: Validar compilação
        run: python -m compileall -q app.py src tests
